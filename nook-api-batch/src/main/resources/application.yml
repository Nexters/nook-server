spring:
  application:
    name: nook-api-batch
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: true

external:
  kakao-local:
    base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    connect-timeout: ${KAKAO_LOCAL_CONNECT_TIMEOUT:3s}
    read-timeout: ${KAKAO_LOCAL_READ_TIMEOUT:5s}
  google-place-photo:
    enabled: ${GOOGLE_PLACE_PHOTO_ENABLED:false}
    base-url: ${GOOGLE_PLACE_BASE_URL:https://places.googleapis.com}
    api-key: ${GOOGLE_MAPS_API_KEY:}
    max-width-px: ${GOOGLE_PLACE_PHOTO_MAX_WIDTH_PX:600}
    connect-timeout: ${GOOGLE_PLACE_PHOTO_CONNECT_TIMEOUT:3s}
    read-timeout: ${GOOGLE_PLACE_PHOTO_READ_TIMEOUT:5s}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-nano}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPENAI_READ_TIMEOUT:30s}

place-parsing:
  worker:
    retry-backoffs: ${PLACE_PARSING_RETRY_BACKOFFS:3s,3s,3s}
    processing-timeout: ${PLACE_PARSING_PROCESSING_TIMEOUT:1m}

post-content-parsing:
  worker:
    retry-backoffs: ${POST_CONTENT_PARSING_RETRY_BACKOFFS:3s,3s,3s}
    processing-timeout: ${POST_CONTENT_PARSING_PROCESSING_TIMEOUT:15m}
