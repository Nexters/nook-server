spring:
  application:
    name: nook-api-batch
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: true

external:
  corepin-ocr:
    base-url: ${COREPIN_OCR_BASE_URL:https://api.corepin.ai}
    api-key: ${COREPIN_API_KEY:}
    connect-timeout: ${COREPIN_OCR_CONNECT_TIMEOUT:3s}
    read-timeout: ${COREPIN_OCR_READ_TIMEOUT:30s}
    max-image-bytes: ${COREPIN_OCR_MAX_IMAGE_BYTES:10485760}
  clova-ocr:
    invoke-url: ${CLOVA_OCR_INVOKE_URL:}
    secret-key: ${CLOVA_OCR_SECRET_KEY:}
    connect-timeout: ${CLOVA_OCR_CONNECT_TIMEOUT:3s}
    read-timeout: ${CLOVA_OCR_READ_TIMEOUT:30s}
    max-image-bytes: ${CLOVA_OCR_MAX_IMAGE_BYTES:10485760}
  place-thumbnail:
    provider: ${PLACE_THUMBNAIL_PROVIDER:post_media}
    fixed-url: ${PLACE_THUMBNAIL_FIXED_URL:https://d6idqwsn9nndw.cloudfront.net/post-media/sha256/3d/3dd7bb6919492e58a76fe9012b82c0a44e4bfdf7bf0784cddd90dc9bbbee17f9.jpg}
  kakao-local:
    base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    connect-timeout: ${KAKAO_LOCAL_CONNECT_TIMEOUT:3s}
    read-timeout: ${KAKAO_LOCAL_READ_TIMEOUT:5s}
  google-place-photo:
    base-url: ${GOOGLE_PLACE_BASE_URL:https://places.googleapis.com}
    api-key: ${GOOGLE_MAPS_API_KEY:}
    max-width-px: ${GOOGLE_PLACE_PHOTO_MAX_WIDTH_PX:600}
    connect-timeout: ${GOOGLE_PLACE_PHOTO_CONNECT_TIMEOUT:3s}
    read-timeout: ${GOOGLE_PLACE_PHOTO_READ_TIMEOUT:5s}
  apify-google-maps:
    base-url: ${APIFY_GOOGLE_MAPS_BASE_URL:https://api.apify.com}
    api-token: ${APIFY_API_TOKEN:}
    actor-id: ${APIFY_GOOGLE_MAPS_ACTOR_ID:compass~crawler-google-places}
    batch-size: ${APIFY_GOOGLE_MAPS_BATCH_SIZE:20}
    connect-timeout: ${APIFY_GOOGLE_MAPS_CONNECT_TIMEOUT:3s}
    read-timeout: ${APIFY_GOOGLE_MAPS_READ_TIMEOUT:300s}
  google-cloud-vision:
    base-url: ${GOOGLE_CLOUD_VISION_BASE_URL:https://vision.googleapis.com}
    api-key: ${GOOGLE_CLOUD_VISION_API_KEY:${GOOGLE_MAPS_API_KEY:}}
    feature-type: ${GOOGLE_CLOUD_VISION_FEATURE_TYPE:DOCUMENT_TEXT_DETECTION}
    connect-timeout: ${GOOGLE_CLOUD_VISION_CONNECT_TIMEOUT:3s}
    read-timeout: ${GOOGLE_CLOUD_VISION_READ_TIMEOUT:30s}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-nano}
    image-text-model: ${OPENAI_IMAGE_TEXT_MODEL:gpt-5-mini}
    max-concurrent-requests: ${OPENAI_MAX_CONCURRENT_REQUESTS:4}
    rate-limit-retry-backoffs: ${OPENAI_RATE_LIMIT_RETRY_BACKOFFS:1s,2s,4s}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPENAI_READ_TIMEOUT:30s}

place-parsing:
  image-text-provider: ${PLACE_PARSING_IMAGE_TEXT_PROVIDER:openai}
  worker:
    retry-backoffs: ${PLACE_PARSING_RETRY_BACKOFFS:3s,3s,3s}
    processing-timeout: ${PLACE_PARSING_PROCESSING_TIMEOUT:1m}
    image-ocr-concurrency: ${PLACE_PARSING_IMAGE_OCR_CONCURRENCY:4}

post-content-parsing:
  worker:
    retry-backoffs: ${POST_CONTENT_PARSING_RETRY_BACKOFFS:3s,3s,3s}
    processing-timeout: ${POST_CONTENT_PARSING_PROCESSING_TIMEOUT:15m}

place-tag-backfill:
  enabled: ${PLACE_TAG_BACKFILL_ENABLED:false}
  post-ids: ${PLACE_TAG_BACKFILL_POST_IDS:}
