spring:
  application:
    name: nook-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

place-parsing:
  worker:
    retry-backoffs: ${PLACE_PARSING_RETRY_BACKOFFS:5s,15s,45s}
    processing-timeout: ${PLACE_PARSING_PROCESSING_TIMEOUT:1m}

external:
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-nano}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPENAI_READ_TIMEOUT:30s}
  kakao-local:
    base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    connect-timeout: ${KAKAO_LOCAL_CONNECT_TIMEOUT:3s}
    read-timeout: ${KAKAO_LOCAL_READ_TIMEOUT:5s}
  naver-map:
    base-url: ${NAVER_MAP_BASE_URL:https://naveropenapi.apigw.ntruss.com}
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    connect-timeout: ${NAVER_MAP_CONNECT_TIMEOUT:3s}
    read-timeout: ${NAVER_MAP_READ_TIMEOUT:5s}
  bright-data:
    base-url: ${BRIGHT_DATA_BASE_URL:https://api.brightdata.com}
    api-token: ${BRIGHT_DATA_API_TOKEN:}
    posts-dataset-id: ${BRIGHT_DATA_POSTS_DATASET_ID:gd_lk5ns7kz21pck8jpis}
    reels-dataset-id: ${BRIGHT_DATA_REELS_DATASET_ID:gd_lyclm20il4r5helnj}
    connect-timeout: ${BRIGHT_DATA_CONNECT_TIMEOUT:3s}
    read-timeout: ${BRIGHT_DATA_READ_TIMEOUT:60s}
  media-storage:
    enabled: ${MEDIA_STORAGE_ENABLED:false}
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    cloud-front-base-url: ${AWS_CLOUDFRONT_BASE_URL:}
    connect-timeout: ${MEDIA_DOWNLOAD_CONNECT_TIMEOUT:3s}
    read-timeout: ${MEDIA_DOWNLOAD_READ_TIMEOUT:30s}
    max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:20971520}
    max-video-bytes: ${MEDIA_MAX_VIDEO_BYTES:104857600}
    max-redirects: ${MEDIA_MAX_REDIRECTS:3}

auth:
  kakao:
    app-id: ${KAKAO_APP_ID:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    issuer: nook-api
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-ttl: 30m
    refresh-ttl: 30d
    signup-ttl: 10m
  apple:
    client-id: ${APPLE_CLIENT_ID:}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
