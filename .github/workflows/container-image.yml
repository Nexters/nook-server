name: Container Image

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

env:
  GABIA_PUBLIC_REGISTRY: everynook.cr.gabiacloud.com
  GABIA_PRIVATE_REGISTRY: iaae7f59.private-cr.gabiacloud.com
  IMAGE_REPOSITORY: nook/nook-api

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      dev-image: ${{ steps.image.outputs.dev-image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to Gabia Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.GABIA_PUBLIC_REGISTRY }}
          username: ${{ secrets.GABIA_REGISTRY_USERNAME }}
          password: ${{ secrets.GABIA_REGISTRY_PASSWORD }}

      - name: Log in to Gabia Private Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.GABIA_PRIVATE_REGISTRY }}
          username: ${{ secrets.GABIA_REGISTRY_USERNAME }}
          password: ${{ secrets.GABIA_REGISTRY_PASSWORD }}

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            prefix="dev"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            prefix="prod"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          public_image="${GABIA_PUBLIC_REGISTRY}/${IMAGE_REPOSITORY}"
          private_image="${GABIA_PRIVATE_REGISTRY}/${IMAGE_REPOSITORY}"

          {
            echo "tags<<EOF"
            echo "${public_image}:${prefix}-${short_sha}"
            echo "${public_image}:${prefix}-latest"
            if [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
              echo "${private_image}:dev-${short_sha}"
              echo "${private_image}:dev-latest"
            fi
            echo "EOF"
            echo "dev-image=${private_image}:dev-${short_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'develop'
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Write SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/nook-server-dev.pem
          chmod 600 ~/.ssh/nook-server-dev.pem

      - name: Deploy to dev VM
        env:
          DEV_IMAGE: ${{ needs.build.outputs.dev-image }}
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_KEY_PATH: ~/.ssh/nook-server-dev.pem
          GABIA_PRIVATE_REGISTRY: ${{ env.GABIA_PRIVATE_REGISTRY }}
          GABIA_REGISTRY_USERNAME: ${{ secrets.GABIA_REGISTRY_USERNAME }}
          GABIA_REGISTRY_PASSWORD: ${{ secrets.GABIA_REGISTRY_PASSWORD }}
        run: .github/scripts/deploy-dev.sh
