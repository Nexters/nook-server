services:
  admin-web:
    image: ${ADMIN_WEB_IMAGE:-nook-admin-web:latest}
    container_name: nook-${ADMIN_ENV:-dev}-admin-web
    build:
      context: ../../nook-admin-web
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-8081}:8080"
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
