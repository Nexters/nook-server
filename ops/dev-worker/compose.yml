services:
  worker:
    image: ${IMAGE}
    container_name: nook-dev-worker
    restart: unless-stopped
    mem_limit: 640m
    mem_reservation: 384m
    memswap_limit: 768m
    env_file:
      - .env
    environment:
      APP_ENV: dev
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul
      JVM_OPTS: "-Xms96m -Xmx320m -Duser.timezone=Asia/Seoul"
      MANAGEMENT_PORT: 8080
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      PLACE_PARSING_WORKER_CONCURRENCY: 1
      POST_CONTENT_PARSING_WORKER_CONCURRENCY: 1
    volumes:
      - ./secrets/aws-credentials:/run/secrets/aws_credentials:ro
      - ./secrets/aws-config:/run/secrets/aws_config:ro
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "192.168.0.21:18081:8080"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 70s
