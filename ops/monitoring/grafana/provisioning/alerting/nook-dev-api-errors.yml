apiVersion: 1

groups:
  - orgId: 1
    name: nook-dev-api-log-alerts
    folder: Nook
    interval: 1m
    rules:
      - uid: nook_dev_api_error_logs
        title: Dev API error logs
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({env="dev", job="nook-api", level="ERROR"}[5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: range
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: KeepLast
        for: 1m
        annotations:
          summary: dev API에서 ERROR 로그가 감지됐습니다.
          description: 최근 5분 동안 nook-dev-api 로그에 ERROR 레벨 로그가 기록됐습니다.
        labels:
          env: dev
          service: nook-api
          severity: warning
        isPaused: false
