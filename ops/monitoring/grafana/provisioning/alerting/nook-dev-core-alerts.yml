apiVersion: 1

groups:
  - orgId: 1
    name: nook-dev-core-alerts
    folder: Nook
    interval: 1m
    rules:
      - uid: nook_dev_api_down
        title: Dev API down
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'up{job="nook-api", env="dev"}'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: dev API target이 응답하지 않습니다.
          description: Prometheus가 2분 동안 nook-api target을 정상적으로 scrape하지 못했습니다.
        labels:
          env: dev
          service: nook-api
          severity: critical
        isPaused: false

      - uid: nook_dev_mysql_exporter_down
        title: Dev MySQL exporter down
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'up{job="mysql", env="dev"}'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: dev MySQL exporter target이 응답하지 않습니다.
          description: Prometheus가 5분 동안 mysqld-exporter target을 정상적으로 scrape하지 못했습니다.
        labels:
          env: dev
          service: mysql
          severity: warning
        isPaused: false

      - uid: nook_dev_node_exporter_down
        title: Dev node exporter down
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'up{job="node", env="dev"}'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: dev node exporter target이 응답하지 않습니다.
          description: Prometheus가 5분 동안 node-exporter target을 정상적으로 scrape하지 못했습니다.
        labels:
          env: dev
          service: nook-dev-vm
          severity: warning
        isPaused: false

      - uid: nook_dev_http_5xx
        title: Dev HTTP 5xx increase
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'sum(increase(http_server_requests_seconds_count{job="nook-api", env="dev", status=~"5.."}[5m])) >= 5 or (sum(increase(http_server_requests_seconds_count{job="nook-api", env="dev"}[5m])) >= 20 and sum(increase(http_server_requests_seconds_count{job="nook-api", env="dev", status=~"5.."}[5m])) / clamp_min(sum(increase(http_server_requests_seconds_count{job="nook-api", env="dev"}[5m])), 1) >= 0.05)'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: dev API의 HTTP 5xx 응답이 증가했습니다.
          description: 최근 5분간 5xx가 5건 이상이거나, 요청이 20건 이상인 상태에서 5xx 비율이 5% 이상으로 5분간 지속됐습니다.
        labels:
          env: dev
          service: nook-api
          severity: warning
        isPaused: false

      - uid: nook_dev_http_latency_p95
        title: Dev HTTP latency p95 high
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="nook-api", env="dev"}[10m]))) >= 1 and sum(increase(http_server_requests_seconds_count{job="nook-api", env="dev"}[10m])) >= 20'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: dev API의 HTTP p95 latency가 높습니다.
          description: 최근 10분간 요청이 20건 이상인 상태에서 p95 latency가 1초 이상으로 10분간 지속됐습니다.
        labels:
          env: dev
          service: nook-api
          severity: warning
        isPaused: false

      - uid: nook_dev_disk_warning
        title: Dev VM disk usage high
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: '1 - (node_filesystem_avail_bytes{job="node", env="dev", mountpoint="/", fstype!="rootfs"} / node_filesystem_size_bytes{job="node", env="dev", mountpoint="/", fstype!="rootfs"})'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.8
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: dev VM 루트 디스크 사용률이 80%를 넘었습니다.
          description: 루트 파일시스템 사용률이 15분 동안 80%를 초과했습니다. 불필요한 파일과 Docker 데이터를 확인하세요.
        labels:
          env: dev
          service: nook-dev-vm
          severity: warning
        isPaused: false

      - uid: nook_dev_disk_critical
        title: Dev VM disk usage critical
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: '1 - (node_filesystem_avail_bytes{job="node", env="dev", mountpoint="/", fstype!="rootfs"} / node_filesystem_size_bytes{job="node", env="dev", mountpoint="/", fstype!="rootfs"})'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.9
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: dev VM 루트 디스크 사용률이 90%를 넘었습니다.
          description: 루트 파일시스템 사용률이 5분 동안 90%를 초과했습니다. 즉시 디스크 공간을 확보하세요.
        labels:
          env: dev
          service: nook-dev-vm
          severity: critical
        isPaused: false

      - uid: nook_dev_memory_warning
        title: Dev VM memory usage high
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: '1 - (node_memory_MemAvailable_bytes{job="node", env="dev"} / node_memory_MemTotal_bytes{job="node", env="dev"})'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.9
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: dev VM 메모리 사용률이 90%를 넘었습니다.
          description: MemAvailable 기준 메모리 사용률이 10분 동안 90%를 초과했습니다.
        labels:
          env: dev
          service: nook-dev-vm
          severity: warning
        isPaused: false

      - uid: nook_dev_hikari_exhausted
        title: Dev DB connection pool exhausted
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'hikaricp_connections_pending{job="nook-api", env="dev"} > 0 or hikaricp_connections_active{job="nook-api", env="dev"} / clamp_min(hikaricp_connections_max{job="nook-api", env="dev"}, 1) >= 0.9'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 3m
        annotations:
          summary: dev API의 DB connection pool이 고갈되고 있습니다.
          description: Hikari pending connection이 발생했거나 pool 사용률이 3분 동안 90% 이상으로 유지됐습니다.
        labels:
          env: dev
          service: nook-api
          severity: critical
        isPaused: false

      - uid: nook_dev_hikari_timeout
        title: Dev DB connection acquisition timeout
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'increase(hikaricp_connections_timeout_total{job="nook-api", env="dev"}[5m]) > 0'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: dev API에서 DB connection 획득 timeout이 발생했습니다.
          description: 최근 5분 동안 Hikari connection 획득 timeout이 한 번 이상 발생했습니다.
        labels:
          env: dev
          service: nook-api
          severity: critical
        isPaused: false
