server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ops-system
    static_configs:
      - targets:
          - localhost
        labels:
          env: ops
          job: varlogs
          __path__: /var/log/*.log

  - job_name: ops-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels:
          - __meta_docker_container_name
        regex: /nook-dev-worker
        action: drop
      - source_labels:
          - __meta_docker_container_name
        regex: /(.+)
        target_label: container
      - source_labels:
          - __meta_docker_container_log_stream
        target_label: stream
      - target_label: env
        replacement: ops

  - job_name: nook-dev-worker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
      - labels:
          level:
    relabel_configs:
      - source_labels:
          - __meta_docker_container_name
        regex: /nook-dev-worker
        action: keep
      - source_labels:
          - __meta_docker_container_id
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log
      - source_labels:
          - __meta_docker_container_name
        regex: /(.+)
        target_label: container
      - source_labels:
          - __meta_docker_container_log_stream
        target_label: stream
      - target_label: env
        replacement: dev
      - target_label: job
        replacement: nook-worker
