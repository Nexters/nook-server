x-api: &api
  restart: unless-stopped
  mem_limit: 768m
  mem_reservation: 512m
  memswap_limit: 1g
  env_file:
    - ../.env
  environment:
    TZ: Asia/Seoul
    JVM_OPTS: "-Xms128m -Xmx384m -Duser.timezone=Asia/Seoul"
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
  volumes:
    - ../secrets/aws-credentials:/run/secrets/aws_credentials:ro
    - ../secrets/aws-config:/run/secrets/aws_config:ro
    - ../secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s
  stop_grace_period: 40s

services:
  blue:
    <<: *api
    image: ${BLUE_IMAGE}
    container_name: nook-live-api-blue
    ports:
      - "127.0.0.1:8081:8080"

  green:
    <<: *api
    image: ${GREEN_IMAGE}
    container_name: nook-live-api-green
    ports:
      - "127.0.0.1:8082:8080"
