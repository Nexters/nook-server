services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: nook-dev-node-exporter
    command:
      - --path.rootfs=/host
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  mysqld-exporter:
    image: quay.io/prometheus/mysqld-exporter:latest
    container_name: nook-dev-mysqld-exporter
    user: "0"
    command:
      - --config.my-cnf=/etc/mysql-exporter/.my.cnf
      - --web.listen-address=:9104
    network_mode: host
    volumes:
      - ./mysql-exporter.my.cnf:/etc/mysql-exporter/.my.cnf:ro
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: nook-dev-promtail
    command:
      - -config.file=/etc/promtail/promtail.yml
      - -config.expand-env=true
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-http://127.0.0.1:3100/loki/api/v1/push}
    network_mode: host
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  error-log-forwarder:
    image: python:3.13-alpine
    container_name: nook-dev-error-log-forwarder
    command:
      - python
      - /app/forward_error_logs.py
    environment:
      ERROR_LOG_CONTAINER_NAME: ${ERROR_LOG_CONTAINER_NAME:-nook-dev-api}
      ERROR_LOG_SLACK_WEBHOOK_URL: ${ERROR_LOG_SLACK_WEBHOOK_URL:?}
      ERROR_LOG_MAX_BYTES: ${ERROR_LOG_MAX_BYTES:-3500}
      ERROR_LOG_FLUSH_SECONDS: ${ERROR_LOG_FLUSH_SECONDS:-2}
    volumes:
      - ./error-log-forwarder/forward_error_logs.py:/app/forward_error_logs.py:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    restart: unless-stopped
