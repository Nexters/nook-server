server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: ${LOKI_PUSH_URL}

scrape_configs:
  - job_name: nook-dev-api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    pipeline_stages:
      - docker: {}
    relabel_configs:
      - source_labels:
          - __meta_docker_container_name
        regex: /nook-dev-api
        action: keep
      - source_labels:
          - __meta_docker_container_id
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log
      - source_labels:
          - __meta_docker_container_name
        regex: /(.+)
        target_label: container
      - source_labels:
          - __meta_docker_container_log_stream
        target_label: stream
      - target_label: env
        replacement: dev
      - target_label: job
        replacement: nook-api
